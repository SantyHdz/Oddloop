services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
    volumes:
      # Named volume: data lives outside the container, so down/up keeps it.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # The only port exposed to the host (RNF-25).
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
